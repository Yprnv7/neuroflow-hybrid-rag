name: CI & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run full BEIR retrieval evaluation'
        required: false
        default: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify MIT License Exists
        run: test -f LICENSE && grep -q "MIT License" LICENSE
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint Check (Ruff)
        run: |
          ruff check src/ tests/ scripts/
      - name: Unit & Integration Tests
        run: |
          PYTHONPATH=src pytest tests/ -v --cov=src/neuroflow --cov-fail-under=80

  benchmark:
    if: github.event.inputs.run_benchmarks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" torch sentence-transformers beir ranx
      - name: Run SciFact Retrieval Benchmark
        run: |
          PYTHONPATH=src python scripts/evaluate_beir.py --dataset scifact --limit 50 --output docs/BENCHMARKS.md
